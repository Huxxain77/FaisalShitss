<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسابات الفروع</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حسابات الفروع">
<meta name="application-name" content="حسابات الفروع">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F1F6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F1F6;--surface:#FFFFFF;--surface-2:#F6F6FA;--ink:#1D1B36;--muted:#6A6884;--line:#E1E0EC;
  --brass:#A77826;--brass-soft:#F5EBD7;--pos:#2B7A57;--pos-soft:#E3F2EA;--neg:#B5443A;--neg-soft:#F8E6E3;--focus:#5B4FD6;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131229;--surface:#1C1A37;--surface-2:#242247;--ink:#ECEAF8;--muted:#A3A1C4;--line:#302E57;
    --brass:#DDB264;--brass-soft:#3A3122;--pos:#62C79A;--pos-soft:#1C3A2E;--neg:#F08A7E;--neg-soft:#41232A;--focus:#A49CFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131229;--surface:#1C1A37;--surface-2:#242247;--ink:#ECEAF8;--muted:#A3A1C4;--line:#302E57;
  --brass:#DDB264;--brass-soft:#3A3122;--pos:#62C79A;--pos-soft:#1C3A2E;--neg:#F08A7E;--neg-soft:#41232A;--focus:#A49CFF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:#F1F1F6!important;color-scheme:light only}
html,body{min-height:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:#F1F1F6!important;color:var(--ink);font-family:"Readex Pro","IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600}
small{font-size:.72em;color:var(--muted);font-weight:400}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.05rem}
.brand-mark{width:32px;height:32px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px}
.brand-logo{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;object-fit:cover;flex:none}
.topnav{display:none;gap:2px}
.top-end{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.top-end .btn{height:38px;padding:0 14px}
[hidden]{display:none!important}
.login{max-width:400px;margin:6vh auto 0}
.topnav button{appearance:none;border:0;background:none;padding:8px 14px;border-radius:10px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:8px;position:relative}
.topnav button svg{width:18px;height:18px}
.topnav button:hover{color:var(--ink);background:var(--surface-2)}
.topnav button[aria-current="page"]{color:var(--ink);font-weight:500}
.topnav button[aria-current="page"]::after{content:"";position:absolute;bottom:-13px;left:12px;right:12px;border-top:2px dashed var(--brass)}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{appearance:none;border:0;background:none;color:var(--muted);font-size:.74rem;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;cursor:pointer}
.tabbar button svg{width:22px;height:22px}
@media (min-width:600px){.tabbar button{font-size:.85rem;padding:12px 4px 11px}}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:500}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:24%;right:24%;border-top:2px dashed var(--brass)}

main{max-width:1180px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px))}
.topbar-in{max-width:1180px!important}
@media (min-width:600px){main{padding-top:28px;padding-inline:24px}.page-head h1{font-size:1.9rem}}
@media (min-width:1024px){main{padding-inline:32px}body{font-size:17px}}
@media (min-width:760px){.topnav{display:flex}.tabbar{display:none}main{padding-bottom:56px}}

/* page head */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:1.7rem;line-height:1.25}
.page-head h1::after{content:"";display:block;width:56px;border-top:2px dashed var(--brass);margin-top:10px}
.sub{margin:6px 0 0;color:var(--muted);font-size:.92rem}
.detail-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.back{appearance:none;border:0;background:none;color:var(--muted);padding:6px 0;display:flex;align-items:center;gap:4px;cursor:pointer;font-size:.95rem}
.back:hover{color:var(--ink)}
.back svg{width:18px;height:18px}

/* buttons */
.btn{appearance:none;border:1px solid transparent;background:var(--ink);color:var(--bg);border-radius:11px;padding:0 18px;height:46px;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn.brass{background:var(--brass);color:#1D1B36}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--neg);color:#fff}
.btn.danger-ghost{background:transparent;color:var(--neg);border-color:var(--line)}
.btn.block{width:100%}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);width:40px;height:40px;border-radius:11px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.sm{width:32px;height:32px;border-radius:9px;border-color:transparent;background:transparent}
.icon-btn.sm:hover{background:var(--neg-soft);color:var(--neg)}

/* list cards */
.list{display:grid;gap:10px}
@media (min-width:600px){.list{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}}
.row-card{appearance:none;text-align:start;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
@media (hover:hover){.row-card:hover{border-color:var(--brass)}}
.row-card:active{border-color:var(--brass)}
.row-card h3{font-size:1.08rem;font-weight:500}
.row-meta{color:var(--muted);font-size:.85rem;margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.row-val{text-align:end;flex:none}
.row-val strong{display:block;font-size:1.15rem;font-weight:600}
.row-val span{font-size:.78rem;color:var(--muted)}

/* panels & forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.panel h2{font-size:1.05rem;margin-bottom:12px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.panel-head h2{margin:0}
.panel-head span{color:var(--muted);font-size:.86rem}
.grid2{display:grid;gap:14px;margin-bottom:14px}
.grid2 .panel{margin:0}
@media (min-width:640px){.grid2.one{grid-template-columns:1fr}}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=password],input[type=email],input[type=date],input[type=month]{width:100%;height:46px;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:0 12px;font-size:16px;min-width:0}
input:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
input.err{border-color:var(--neg);box-shadow:0 0 0 3px color-mix(in srgb,var(--neg) 20%,transparent)}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preview{min-height:1.4em;font-size:.86rem;color:var(--brass);margin:-2px 0 10px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:10px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:8px 4px;border-radius:9px;color:var(--muted);font-size:.95rem}
.seg input:checked+span{background:var(--ink);color:var(--bg);font-weight:500}
.seg input:focus-visible+span{outline:2px solid var(--focus)}

/* date bar */
.date-bar{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.date-bar input{flex:1;max-width:260px}
.date-bar .btn{height:40px;padding:0 14px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat span{display:block;font-size:.78rem;color:var(--muted)}
.stat strong{font-size:1.15rem;font-weight:600}
.stat.pos strong{color:var(--pos)}
.stat.neg strong{color:var(--neg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.chip{font-size:.8rem;background:var(--surface-2);border-radius:999px;padding:3px 10px;color:var(--muted)}
.chip b{color:var(--ink);font-weight:500}

/* stitched hero: the one memorable element */
.hero{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 22px;margin-bottom:14px}
.hero::after{content:"";position:absolute;inset:7px;border:1.5px dashed var(--brass);border-radius:14px;pointer-events:none;opacity:.75}
.hero-label{color:var(--muted);font-size:.9rem}
.hero-num{display:block;font-size:2.6rem;font-weight:600;line-height:1.2;margin:4px 0 10px;letter-spacing:-.01em}
.hero-num small{font-size:.38em}
.hero-row{display:flex;gap:18px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.hero-row b{color:var(--ink);font-weight:500}

/* items */
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item-main{flex:1;min-width:0}
.item-title{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item-note{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.item-amt{font-weight:600;flex:none}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.tag{font-size:.76rem;padding:2px 9px;border-radius:999px;font-weight:500}
.tag.in{background:var(--pos-soft);color:var(--pos)}
.tag.out{background:var(--neg-soft);color:var(--neg)}
.tag.brass{background:var(--brass-soft);color:var(--brass)}
.empty{color:var(--muted);text-align:center;padding:20px 8px;margin:0;font-size:.92rem}
.empty-big{background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:36px 20px;text-align:center;color:var(--muted)}
.empty-big p{margin:0 0 14px}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:520px}
th{font-weight:500;color:var(--muted);font-size:.78rem;text-align:start;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:end}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:2px dashed var(--brass);border-bottom:0;padding-top:12px}
.linkish{appearance:none;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.linkish:hover{text-decoration-color:var(--brass)}
tr.sel td{background:var(--brass-soft)}

.section-title{font-size:1.2rem;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.section-title::before{content:"";width:18px;border-top:2px dashed var(--brass)}
.range{display:grid;gap:8px;grid-template-columns:1fr;margin-bottom:6px}
@media (min-width:600px){.range{grid-template-columns:1.2fr 1fr 1fr;gap:12px}}
@media (min-width:900px){table{font-size:.95rem}td{padding:12px 10px}}

.loading{color:var(--muted);padding:24px 0;text-align:center}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,9,25,.48);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.scrim{align-items:center}}
.dialog{background:var(--surface);border-radius:20px;padding:22px;width:100%;max-width:420px;border:1px solid var(--line);animation:pop .18s ease-out}
.dialog h3{font-size:1.15rem;margin-bottom:12px}
.dialog p{margin:0 0 12px;color:var(--muted)}
.mact{display:flex;flex-direction:column;gap:8px;margin-top:16px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.92rem;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.sync{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;height:34px;padding:0 12px;display:flex;align-items:center;gap:7px;font-size:.8rem;color:var(--muted);cursor:pointer;white-space:nowrap;flex:none}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-s="synced"] i{background:var(--pos)}
.sync[data-s="saving"] i,.sync[data-s="connecting"] i{background:var(--brass);animation:blink 1s ease-in-out infinite}
.sync[data-s="offline"] i{background:var(--brass)}
.sync[data-s="offline"]{color:var(--brass);border-color:var(--brass-soft);background:var(--brass-soft)}
.sync[data-s="error"] i{background:var(--neg)}
.sync[data-s="error"]{color:var(--neg);border-color:var(--neg-soft);background:var(--neg-soft)}
@keyframes blink{50%{opacity:.25}}
.info-rows{display:grid;gap:8px;margin:0 0 6px}
.info-rows div{display:flex;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:.92rem}
.info-rows b{font-weight:500}
.login{max-width:400px;margin:6vh auto 0}
.login .btn{width:100%}
.row-wrap{display:flex;gap:8px;align-items:stretch}
.row-wrap .row-card{flex:1;min-width:0}
.row-btns{display:flex;flex-direction:column;gap:6px}
.row-wrap .row-btns .icon-btn{width:46px;height:auto;flex:1;border-radius:14px}
.edit-btn:hover,.edit-btn:focus-visible{color:var(--ink);border-color:var(--brass)}
.del-btn{color:var(--muted)}
.del-btn:hover,.del-btn:focus-visible{color:var(--neg);border-color:var(--neg);background:var(--neg-soft)}
.field-lbl{display:block;font-size:.82rem;color:var(--muted);margin-bottom:5px}
.seg.seg2{grid-template-columns:1fr 1fr}
.logout-btn{appearance:none;width:34px;height:34px;border-radius:999px;display:grid;place-items:center;cursor:pointer;flex:none;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.logout-btn svg{width:17px;height:17px}
.logout-btn:hover{color:var(--neg);border-color:var(--neg)}
.sum-list{display:grid;gap:2px;margin-top:6px}
.sum-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.98rem}
.sum-row b{font-weight:600;white-space:nowrap}
.sum-row.minus b{color:var(--neg)}
.sum-row.total{border-bottom:0;border-top:2px solid var(--ink);margin-top:6px;padding-top:12px;font-size:1.1rem}
.sum-row.total b{font-size:1.5rem}
.sum-row .hint{display:block;font-size:.78rem;color:var(--muted);font-weight:400}
.print-only{display:none}
.pblock h3.pb-title{font-size:1.05rem;margin:0 0 10px}
.pblock h3.pb-title small{font-weight:400;color:var(--muted);font-size:.8rem}
.pb-sub{font-size:.85rem;margin:14px 0 6px;color:var(--muted);font-weight:500}
table.mini{min-width:0;font-size:.85rem}
table.mini td{padding:5px 6px}
.sign{display:flex;justify-content:space-between;gap:12px;margin-top:22px;font-size:.85rem;color:var(--muted)}
.print-head{display:none}
@page{size:A4;margin:14mm 12mm}
@media print{
  .pm-branches [data-sec]:not([data-sec="branches"]),.pm-workers [data-sec]:not([data-sec="workers"]){display:none!important}
  .pm-branches .po-branches,.pm-workers .po-workers{display:block}
  .pblock{break-inside:avoid;page-break-inside:avoid}
  .pm-workers #rWorkerCards .pblock{break-before:page;page-break-before:always}
  html,body{background:#fff!important}
  body{font-size:11.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .topbar,.tabbar,.no-print,#modal-root,.toast,.back,.icon-btn{display:none!important}
  main{max-width:none;padding:0!important}
  .print-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px dashed #A77826;padding-bottom:10px;margin-bottom:16px}
  .print-head strong{display:block;font-size:16pt}
  .print-head span{color:#6A6884;font-size:10pt}
  #pPeriod{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .page-head{display:none}
  .section-title{margin:18px 0 8px;font-size:13pt;break-after:avoid;page-break-after:avoid}
  .panel,.hero{border:1px solid #ccc;border-radius:10px;padding:10px 12px;margin-bottom:10px;break-inside:avoid;page-break-inside:avoid}
  .hero-num{font-size:20pt;margin:2px 0 6px}
  .tbl-wrap{overflow:visible;margin:0}
  table{min-width:0;font-size:9.5pt}
  th,td{padding:6px 5px;white-space:normal}
  tr{break-inside:avoid;page-break-inside:avoid}
  thead{display:table-header-group}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <div class="brand"><img class="brand-logo" src="icon-192.png" alt="">حسابات الفروع</div>
  <div class="top-end"><nav class="topnav" id="topnav" aria-label="الأقسام"></nav><button class="sync" id="sync" data-act="syncInfo" data-s="connecting" aria-live="polite"><i></i><span>جارٍ الاتصال</span></button><button class="logout-btn" id="logoutBtn" data-act="logout" hidden aria-label="تسجيل الخروج" title="تسجيل الخروج"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5v16h5M14 8l-4 4 4 4M10 12h10"/></svg></button></div>
</div></header>
<main id="view"></main>
<nav class="tabbar" id="tabbar" aria-label="الأقسام"></nav>
<div id="modal-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ========= إعدادات Firebase: الصق هنا بيانات مشروعك ========= */
const firebaseConfig = {

      document.removeEventListener('keydown',onKey,true);modalClose=null;if(prev&&prev.focus)prev.focus();
    };

      if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();e.stopPropagation();close(actions[0].key)}};

/* ---------- calculations ---------- */
function sumEntries(list){
  const r={in:0,out:0,cash:0,mada:0,visa:0};
  list.forEach(x=>{if(x.kind==='in'){r.in+=x.amount;r[x.method]=(r[x.method]||0)+x.amount}else r.out+=x.amount});
  return r;
}
function repTotals(repId,from,to){
  const tx=S.repTx.filter(x=>x.repId===repId);
  const inR=tx.filter(x=>inRange(x.date,from,to));
  const upTo=tx.filter(x=>x.date<=to);
  return{added:sum(inR.filter(x=>x.kind==='add'),x=>x.amount),paid:sum(inR.filter(x=>x.kind==='pay'),x=>x.amount),
    balance:sum(upTo,x=>x.kind==='add'?x.amount:-x.amount)};
}
/* طريقة الحساب: piece = بالقطعة، monthly = راتب شهري */
const isMonthly=w=>w&&w.payType==='monthly';                 // راتب فقط
const isMixed=w=>w&&w.payType==='mixed';                      // راتب + قطعة
const hasSalary=w=>w&&(w.payType==='monthly'||w.payType==='mixed');
const hasPieces=w=>!w||w.payType!=='monthly';
const PAY_LABEL={piece:'بالقطعة',monthly:'راتب شهري',mixed:'راتب + قطعة'};
const payOf=w=>(w&&w.payType)||'piece';
function salaryFor(w,m){
  const h=(w.salaryHist&&w.salaryHist.length?w.salaryHist:[{from:'0000-00',amount:w.salary||0}]).slice().sort((a,b)=>a.from.localeCompare(b.from));
  let v=0;h.forEach(x=>{if(x.from<=m)v=x.amount});return v;
}
function monthsIn(from,to){const out=[];let m=from.slice(0,7);const end=to.slice(0,7);while(m<=end){out.push(m);m=shiftMonth(m,1)}return out}
const rateText=w=>isMixed(w)?`راتب ${fmt(salaryFor(w,curMonth()))} + القطعة ${fmt(w.price||0)}`:isMonthly(w)?`راتب شهري ${fmt(salaryFor(w,curMonth()))}`:`بالقطعة ${fmt(w.price||0)}`;
function workerTotals(wid,from,to){
  const w=S.workers.find(x=>x.id===wid)||{};
  const tx=S.workerTx.filter(x=>x.workerId===wid&&inRange(x.date,from,to));
  const p=tx.filter(x=>x.kind==='pieces'),e=tx.filter(x=>x.kind==='exp');
  const pieces=sum(p,x=>x.qty),ded=sum(e,x=>x.amount);
  const salary=hasSalary(w)?sum(monthsIn(from,to),m=>salaryFor(w,m)):0,piecePay=hasPieces(w)?sum(p,x=>x.amount):0;
  const gross=salary+piecePay;
  return{pieces,salary,piecePay,gross,ded,net:gross-ded,tx:hasPieces(w)?tx:e};
}

        days.map(d=>{const r=sumEntries(be.filter(x=>x.date===d));return`<tr><td>${fmtShort(d)}</td>${cell(r.cash)}${cell(r.mada)}${cell(r.visa)}${cell(r.in,'pos')}${cell(r.out,'neg')}${cell(r.in-r.out)}</tr>`}).join('')
      }</tbody><tfoot><tr><td>الإجمالي</td>${cell(bt.cash)}${cell(bt.mada)}${cell(bt.visa)}${cell(bt.in,'pos')}${cell(bt.out,'neg')}${cell(bt.in-bt.out)}</tr></tfoot></table>${
        exps.length?`<h4 class="pb-sub">تفاصيل المصروفات</h4><table class="mini"><tbody>${exps.map(x=>`<tr><td>${fmtShort(x.date)}</td><td>${esc(x.note||'بدون ملاحظة')}</td>${cell(x.amount,'neg')}</tr>`).join('')}</tbody></table>`:''}</section>`}).join('')||'<p class="empty">ما فيه يوميات في هذي الفترة.</p>';
    // workers
    if(!S.workers.length){$('#rWorkers').innerHTML='<p class="empty">ما فيه عمال مضافين.</p>';$('#rWorkerCards').innerHTML=''}
    else{const rows=[...S.workers].sort(byName).map(w=>({w,...workerTotals(w.id,a,b)}));
      $('#rWorkers').innerHTML=`<table><thead><tr><th>العامل</th><th>النوع</th><th>طريقة الحساب</th><th class="num">عدد الثياب</th><th class="num">المستحق</th><th class="num">الخصومات</th><th class="num">المستحق بعد الخصم</th></tr></thead><tbody>${
        rows.map(r=>`<tr><td>${esc(r.w.name)}</td><td>${esc(r.w.type||'—')}</td><td>${PAY_LABEL[payOf(r.w)]}</td><td class="num">${hasPieces(r.w)?fmt(r.pieces):'—'}</td>${cell(r.gross)}${cell(r.ded,'neg')}${cell(r.net)}</tr>`).join('')
      }</tbody><tfoot><tr><td>الإجمالي</td><td></td><td></td><td class="num">${fmt(sum(rows,r=>hasPieces(r.w)?r.pieces:0))}</td>${cell(sum(rows,r=>r.gross))}${cell(sum(rows,r=>r.ded),'neg')}${cell(sum(rows,r=>r.net))}</tr></tfoot></table>`;
      // كشف لكل عامل (يظهر في طباعة تقرير العمال)
      $('#rWorkerCards').innerHTML=rows.map(r=>{const w=r.w,exps=r.tx.filter(x=>x.kind==='exp').sort(byDateAsc),pcs=r.tx.filter(x=>x.kind==='pieces').sort(byDateAsc);

        ${hasSalary(w)?line('الراتب الشهري',r.salary):''}
        ${hasPieces(w)?line(`الثياب: ${fmt(r.pieces)} ثوب`,r.piecePay):''}
        ${line('المستحق',r.gross)}${line('الخصومات والسلف',r.ded,'minus')}${line('الصافي المستحق',r.net,'total')}
        ${pcs.length?`<h4 class="pb-sub">الثياب</h4><table class="mini"><tbody>${pcs.map(x=>`<tr><td>${fmtShort(x.date)}</td><td>${fmt(x.qty)} × ${fmt(x.price)}</td>${cell(x.amount)}</tr>`).join('')}</tbody></table>`:''}
        ${exps.length?`<h4 class="pb-sub">الخصومات</h4><table class="mini"><tbody>${exps.map(x=>`<tr><td>${fmtShort(x.date)}</td><td>${esc(x.note||'بدون ملاحظة')}</td>${cell(x.amount,'neg')}</tr>`).join('')}</tbody></table>`:''}
        <div class="sign"><span>توقيع العامل: ................................</span><span>التاريخ: ..................</span></div></section>`}).join('');}
    // الملخص
    {const wages=sum(S.workers,w=>workerTotals(w.id,a,b).gross),repPaid=sum(S.reps,r=>repTotals(r.id,a,b).paid),net=T.in-T.out-wages-repPaid;
      const row=(label,hint,v,cls)=>`<div class="sum-row ${cls||''}"><span>${label}${hint?`<span class="hint">${hint}</span>`:''}</span><b>${cls==='minus'?'− ':''}${fmt(v)} <small>ر.س</small></b></div>`;
      $('#sumList').innerHTML=row('إجمالي دخل كل الفروع','كاش + مدى + فيزا',T.in)+row('مصروفات الفروع','',T.out,'minus')+row('رواتب العمال','المستحق كامل قبل خصم السلف',wages,'minus')+row('المدفوع للمناديب','اللي سددته لهم في الفترة',repPaid,'minus')+row('الصافي النهائي','',net,'total');
      $('#sumNet').innerHTML=money(net);}
    // reps
    if(!S.reps.length)$('#rReps').innerHTML='<p class="empty">ما فيه مناديب مضافين.</p>';
    else{const rows=[...S.reps].sort(byName).map(r=>({r,...repTotals(r.id,a,b)}));
      $('#rReps').innerHTML=`<table><thead><tr><th>المندوب</th><th class="num">نزل بالفترة</th><th class="num">دفعت له بالفترة</th><th class="num">المتبقي من المبلغ الرئيسي</th></tr></thead><tbody>${
        rows.map(x=>`<tr><td>${esc(x.r.name)}</td>${cell(x.added)}${cell(x.paid,'pos')}${cell(x.balance)}</tr>`).join('')
      }</tbody><tfoot><tr><td>الإجمالي</td>${cell(sum(rows,x=>x.added))}${cell(sum(rows,x=>x.paid),'pos')}${cell(sum(rows,x=>x.balance))}</tr></tfoot></table>`}
  }
}
};

function pcsPreview(){
  const el=$('#pcs'),p=$('#pcsPrev');if(!el||!p||!UI.detail)return;
  const w=S.workers.find(x=>x.id===UI.detail.id);const n=num(el.value);
  p.textContent=w&&n>0?`${fmt(n)} × ${fmt(w.price)} = ${fmt(n*w.price)} ر.س`:'';
}

/* ---------- actions ---------- */
const typeField=(v='')=>{const types=[...new Set(['خياط','قصّاص','كوّاي',...S.workers.map(w=>w.type).filter(Boolean)])];
  return`<label class="field"><span>نوع العامل</span><input type="text" name="type" list="wtypes" value="${esc(v)}" placeholder="مثال: خياط، قصّاص، كوّاي"></label><datalist id="wtypes">${types.map(t=>`<option value="${esc(t)}">`).join('')}</datalist>`};
function workerForm(w={}){
  const pt=payOf(w),cur=w.id?salaryFor(w,curMonth()):'',price=w.id?(w.price??''):'';
  const opt=(v,l)=>`<label><input type="radio" name="pay" value="${v}" ${pt===v?'checked':''}><span>${l}</span></label>`;
  return`<label class="field"><span>اسم العامل</span><input type="text" name="name" value="${esc(w.name||'')}"></label>
  ${typeField(w.type||'')}
  <span class="field-lbl">طريقة الحساب</span>
  <div class="seg" role="radiogroup" aria-label="طريقة الحساب">${opt('piece','بالقطعة')}${opt('monthly','راتب شهري')}${opt('mixed','راتب + قطعة')}</div>
  <label class="field" id="salField" ${pt==='piece'?'hidden':''}><span>الراتب الشهري (ر.س)</span><input type="text" name="salary" inputmode="decimal" value="${pt==='piece'?'':cur}"></label>
  <label class="field" id="pcsField" ${pt==='monthly'?'hidden':''}><span id="pcsLbl">${pt==='mixed'?'سعر القطعة للأوفر تايم (ر.س)':'سعر القطعة (ر.س)'}</span><input type="text" name="price" inputmode="decimal" value="${pt==='monthly'?'':price}"></label>
  ${w.id?'<p class="sub" style="margin-top:-4px">الراتب الجديد يطبق من هذا الشهر وبعده، وسعر القطعة الجديد يطبق على الثياب اللي تضيفها بعد التعديل.</p>':''}`;
}
/* يقرأ الراتب وسعر القطعة من النموذج حسب طريقة الحساب */
function readPay(v){
  const pt=['piece','monthly','mixed'].includes(v.pay)?v.pay:'piece';
  const sal=num(v.salary),pr=num(v.price);
  if(pt!=='piece'&&!(sal>=0)){toast('اكتب الراتب الشهري');return null}
  if(pt!=='monthly'&&!(pr>=0)){toast('اكتب سعر القطعة');return null}
  return{pt,sal:pt==='piece'?0:sal,pr:pt==='monthly'?0:pr};
}
async function addEntity(col,label,isWorker){
  const r=await modal({title:`إضافة ${label}`,body:isWorker?workerForm():`<label class="field"><span>اسم ${label}</span><input type="text" name="name"></label>`,
    actions:[{key:'ok',label:'إضافة'},{key:'cancel',label:'إلغاء',cls:'ghost'}]});
  if(!r)return;const name=r.values.name.trim();
  if(!name){toast('اكتب الاسم');return}
  const o={name};
  if(isWorker){const P=readPay(r.values);if(!P)return;
    o.type=(r.values.type||'').trim();o.payType=P.pt;o.price=P.pr;
    if(P.pt!=='piece'){o.salary=P.sal;o.salaryHist=[{from:curMonth(),amount:P.sal}]}}
  if(await safe(()=>store.add(col,o)))toast(`تمت إضافة ${name}`);
}
async function editEntity(col,id){
  const ent=S[col].find(x=>x.id===id);if(!ent)return;const c=ENT[col],isW=col==='workers';
  const r=await modal({title:`تعديل ${c.label}`,body:isW?workerForm(ent):`<label class="field"><span>الاسم</span><input type="text" name="name" value="${esc(ent.name)}"></label>`,
    actions:[{key:'save',label:'حفظ التعديل'},{key:'cancel',label:'إلغاء',cls:'ghost'}]});
  if(!r)return;const n=r.values.name.trim();if(!n){toast('اكتب الاسم');return}
  const patch={};if(n!==ent.name)patch.name=n;
  if(isW){
    const t=(r.values.type||'').trim();if(t!==(ent.type||''))patch.type=t;
    const P=readPay(r.values);if(!P)return;
    if(P.pt!==payOf(ent))patch.payType=P.pt;
    if(P.pt!=='piece'){const m=curMonth();if(P.sal!==salaryFor(ent,m)||!ent.salaryHist){
        const hist=(ent.salaryHist||[]).filter(x=>x.from!==m).concat([{from:m,amount:P.sal}]);patch.salary=P.sal;patch.salaryHist=hist}}
    if(P.pt!=='monthly'&&P.pr!==ent.price)patch.price=P.pr;
  }
  if(!Object.keys(patch).length){toast('ما فيه تغيير');return}
  if(await safe(()=>store.update(col,id,patch)))toast('تم حفظ التعديل');
}
const ENT={branches:{label:'الفرع',child:'entries',fk:'branchId'},reps:{label:'المندوب',child:'repTx',fk:'repId'},workers:{label:'العامل',child:'workerTx',fk:'workerId'}};
const withDel=(html,col,id)=>`<div class="row-wrap">${html}<div class="row-btns"><button class="icon-btn edit-btn" data-act="editEntity" data-col="${col}" data-id="${id}" aria-label="تعديل">${svg('edit')}</button><button class="icon-btn del-btn" data-act="delEntity" data-col="${col}" data-id="${id}" aria-label="حذف">${svg('trash')}</button></div></div>`;
async function deleteEntity(col,id){
  const c=ENT[col],ent=S[col].find(x=>x.id===id);if(!ent)return;
  let kids=S[c.child].filter(x=>x[c.fk]===id);
  if(store.root&&WINDOWED.includes(c.child)){try{const sn=await store.root.collection(c.child).where(c.fk,'==',id).get();kids=sn.docs.map(d=>({id:d.id}))}catch(e){toast('تأكد من اتصال النت قبل الحذف');return}}
  const r=await modal({title:`حذف ${c.label} «${esc(ent.name)}»؟`,
    body:`<p>${kids.length?`بينحذف ${c.label} ومعه <b>${kids.length}</b> سجل تابع له نهائيًا.`:`بينحذف ${c.label} نهائيًا.`} ما تقدر ترجعه بعد الحذف.</p><label class="field"><span>للتأكيد اكتب كلمة <b>حذف</b></span><input type="text" name="confirm" autocomplete="off" placeholder="حذف"></label>`,
    actions:[{key:'del',label:'حذف نهائي',cls:'danger'},{key:'cancel',label:'إلغاء',cls:'ghost'}]});
  if(!r)return;
  if(r.values.confirm.replace(/\s/g,'')!=='حذف'){toast('ما تم الحذف، لازم تكتب كلمة حذف');return}
  if(UI.detail&&UI.detail.id===id)go(UI.tab);
  if(await safe(async()=>{for(const k of kids)await store.remove(c.child,k.id);await store.remove(col,id)}))toast(`تم حذف ${ent.name}`);
}
async function delRow(col,id,title){if(await confirmBox(title,'ما تقدر ترجعه بعد الحذف.'))await safe(()=>store.remove(col,id))}

let PRINT_TITLE='التقرير الشهري';
const ACT={
  nav:t=>go(t.dataset.tab),
  back:()=>{if(history.state&&history.state.nav&&history.length>2)history.back();else go(UI.tab)},
  menu:()=>editEntity({branch:'branches',rep:'reps',worker:'workers'}[UI.detail.type],UI.detail.id),

  addBranch:()=>addEntity('branches','فرع'),
  addRep:()=>addEntity('reps','مندوب'),
  addWorker:()=>addEntity('workers','عامل',true),
  openBranch:t=>go('branches',{type:'branch',id:t.dataset.id}),
  openRep:t=>go('reps',{type:'rep',id:t.dataset.id}),
  openWorker:t=>go('workers',{type:'worker',id:t.dataset.id}),
  dayShift:t=>{UI.date=shiftDay(UI.date,+t.dataset.n);refresh()},
  dayToday:()=>{UI.date=today();refresh()},
  pickDay:t=>{UI.date=t.dataset.d;refresh();window.scrollTo({top:0})},
  async addIncome(){const a=amountOf('#incAmt');if(a==null)return;
    const m=(document.querySelector('input[name=method]:checked')||{}).value||'cash';
    if(await safe(()=>store.add('entries',{branchId:UI.detail.id,kind:'in',amount:a,method:m,date:UI.date}))){$('#incAmt').value='';$('#incAmt').focus();toast(`أُضيف ${fmt(a)} ${ML[m]}`)}},
  async addExpense(){const a=amountOf('#expAmt');if(a==null)return;const note=$('#expNote').value.trim();

  delEntry:t=>delRow('entries',t.dataset.id,'حذف هذه الحركة؟'),
  async repAdd(){const a=amountOf('#addAmt');if(a==null)return;
    if(await safe(()=>store.add('repTx',{repId:UI.detail.id,kind:'add',amount:a,note:$('#addNote').value.trim(),date:$('#addDate').value||today()}))){$('#addAmt').value='';$('#addNote').value='';toast('أُضيف المبلغ')}},
  async repPay(){const a=amountOf('#payAmt');if(a==null)return;
    if(await safe(()=>store.add('repTx',{repId:UI.detail.id,kind:'pay',amount:a,note:$('#payNote').value.trim(),date:$('#payDate').value||today()}))){$('#payAmt').value='';$('#payNote').value='';toast('تم تسجيل التسديد')}},
  delRepTx:t=>delRow('repTx',t.dataset.id,'حذف هذه الحركة؟'),
  async addPieces(){const w=S.workers.find(x=>x.id===UI.detail.id);if(!w)return;const q=amountOf('#pcs');if(q==null)return;
    if(await safe(()=>store.add('workerTx',{workerId:w.id,kind:'pieces',qty:q,price:w.price,amount:q*w.price,date:$('#pcsDate').value||today()}))){$('#pcs').value='';pcsPreview();toast(`أُضيف ${fmt(q)} ثوب`)}},
  async addWExp(){const a=amountOf('#wexAmt');if(a==null)return;
    if(await safe(()=>store.add('workerTx',{workerId:UI.detail.id,kind:'exp',amount:a,note:$('#wexNote').value.trim(),date:$('#wexDate').value||today()}))){$('#wexAmt').value='';$('#wexNote').value='';toast('تم الخصم')}},
  delWTx:t=>delRow('workerTx',t.dataset.id,'حذف هذا التسجيل؟'),
  syncInfo:()=>syncInfo(),
  login:async()=>{const u=$('#lgUser').value,p=$('#lgPass').value;if(!u.trim()||!p){toast('اكتب البريد وكلمة المرور');return}
    const b=$('#lgBtn');b.disabled=true;b.textContent='جارٍ الدخول…';
    try{await auth.signInWithEmailAndPassword(normEmail(u),p);try{localStorage.setItem(EMAIL_KEY,normEmail(u))}catch(e){}}
    catch(e){toast(AUTH_ERR[e&&e.code]||'صار خطأ، حاول مرة ثانية');b.disabled=false;b.textContent='دخول'}},
  resetPw:async()=>{const u=$('#lgUser').value.trim();if(!u){toast('اكتب بريدك أول');return}
    try{await auth.sendPasswordResetEmail(normEmail(u));toast('أرسلنا رابط تغيير كلمة المرور لبريدك')}catch(e){toast(AUTH_ERR[e&&e.code]||'ما قدرنا نرسل الرابط، تأكد من البريد')}},
  logout:async()=>{
    const msg=SYNC.pending?'فيه عمليات ما انرفعت للحين، لو طلعت الحين ممكن تضيع. متأكد؟':'بتحتاج تدخل كلمة المرور مرة ثانية.';
    if(await confirmBox('تسجيل الخروج؟',msg,'خروج'))wipeAndReload()},
  delEntity:t=>deleteEntity(t.dataset.col,t.dataset.id),
  delCurrent:()=>deleteEntity({branch:'branches',rep:'reps',worker:'workers'}[UI.detail.type],UI.detail.id),
  printReport:async()=>{
    const r=await modal({title:'وش تبي تطبع؟',body:'<p>اختار نوع التقرير للفترة المحددة.</p>',actions:[{key:'all',label:'التقرير الكامل'},{key:'branches',label:'يوميات الفروع فقط',cls:'ghost'},{key:'workers',label:'تقرير العمال فقط',cls:'ghost'},{key:'cancel',label:'إلغاء',cls:'ghost'}]});
    if(!r)return;
    const titles={all:'التقرير الشهري',branches:'تقرير يوميات الفروع',workers:'تقرير العمال'};
    document.body.classList.remove('pm-all','pm-branches','pm-workers');document.body.classList.add('pm-'+r.key);
    PRINT_TITLE=titles[r.key];refresh();const t=$('#pTitle');if(t)t.textContent=PRINT_TITLE;
    setTimeout(()=>window.print(),150)},
  wMonthShift:t=>{UI.wMonth=shiftMonth(UI.wMonth,+t.dataset.n);refresh()},
  rMonthShift:t=>{UI.rMonth=shiftMonth(UI.rMonth,+t.dataset.n);[UI.rFrom,UI.rTo]=monthBounds(UI.rMonth);refresh()}
};

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.closest('#modal-root'))return;const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t)}});

  if(el.id==='rTo'){UI.rTo=v;refresh()}
});
